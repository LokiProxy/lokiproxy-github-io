title: "LokiProxy - Professional Proxy Solutions"

description: >
  LokiProxy provides professional proxy solutions including
  residential proxies, mobile proxies, static residential proxies,
  rotating proxies, HTTP proxies and SOCKS5 proxies for developers,
  businesses and technical users.

url: "https://www.lokiproxy.com"
baseurl: "/proxy-provider"

lang: en
timezone: UTC

theme: minima

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /blog/:title/

header_pages:
  - index.md
  - proxy-types.md
  - authentication.md
  - api.md
  - blog/index.md

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
